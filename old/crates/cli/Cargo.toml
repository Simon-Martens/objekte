[package]
name = "objekte-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "objekte"
path = "src/main.rs"

[features]
index-timings = ["objekte-core/index-timings"]

[dependencies]
objekte-core = { path = "../core" }
regex = "1"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "layout-cache"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-width = "0.2"

[dev-dependencies]
tempfile = "3"
