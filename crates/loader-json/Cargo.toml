[package]
name = "objekte-loader-json"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
objekte-search-core = { path = "../core" }
serde_json = { version = "1", features = ["arbitrary_precision"] }
sha2 = "0.10"
serde = "1"
memchr = "2.8.3"
smallvec = "1.15"

[dev-dependencies]
objekte-search-core = { path = "../core", features = ["test-scan-instrumentation"] }
