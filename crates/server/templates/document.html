{% if message %}<template data-notification="success">{{ message }}</template>{% endif %}
<form id="document-form" class="surface" method="post" action="{{ url }}" data-live-validation="{{ validation_url }}" data-indicator:_pending data-on:submit__prevent="@post(el.getAttribute('action'),{contentType:'form',retry:'never',retryMaxCount:0})">
  <span data-validation-request data-on:validate-draft="@post(el.closest('form').dataset.liveValidation,{contentType:'form',requestCancellation:evt.detail.controller,retry:'never',retryMaxCount:0})"></span>
  <input type="hidden" name="csrf" value="{{ csrf }}"><input type="hidden" name="revision" value="{{ revision }}"><input type="hidden" name="file" value="{{ file }}">
  <div class="section-heading"><h2><i class="ri-braces-line" aria-hidden="true"></i>JSON document</h2><span class="badge">Schema validated</span></div>
  <div class="document-content"><label class="sr-only" for="document-source">JSON document</label><textarea id="document-source" class="source" name="raw" rows="24" {% if not editable %}readonly{% endif %} spellcheck="false" aria-describedby="document-validation">
{{ raw }}</textarea></div>
  <footer class="document-footer"><div id="document-validation" role="status" aria-live="polite" class="help">{% if editable %}Validated as you type{% else %}Read-only document{% endif %}</div><div class="actions">{% if editable %}<button name="action" value="validate"><i class="ri-check-double-line" aria-hidden="true"></i>{{ "Validate"|t }}</button><button class="primary" name="action" value="save"><i class="ri-save-line" aria-hidden="true"></i>{{ "Save changes"|t }}</button>{% endif %}</div></footer>
</form>
