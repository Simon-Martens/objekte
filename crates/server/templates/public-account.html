<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ title }} · Objekte</title>{% include "theme-init.html" %}{{ assets|safe }}</head><body class="login-page"><div class="login-theme">{% include "theme-switch.html" %}</div><main class="login surface"><span class="brand-mark"><i class="ri-stack-line" aria-hidden="true"></i></span><p class="eyebrow">Objekte / Account</p><h1>{{ title }}</h1>{% if !message.is_empty() %}<p class="error" role="alert">{{ message }}</p>{% endif %}<form method="post" action="{{ action }}">{% if invite %}<label>Email<input type="email" name="email" required autocomplete="username"></label><label>Display name<input name="name" required autocomplete="name"></label>{% endif %}<label>New password<input type="password" name="password" minlength="12" autocomplete="new-password" required></label><button class="primary">{{ title }}<i class="ri-arrow-right-line" aria-hidden="true"></i></button></form><a class="breadcrumb" href="/auth/login">Back to sign in</a></main></body></html>
