[package]
name = "objekte-bench"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "json-query-grep-compare"
path = "src/bin/json_query_grep_compare.rs"

[[bin]]
name = "json-query-mix"
path = "src/bin/json_query_mix.rs"

[[bin]]
name = "json-query-sort-mix"
path = "src/bin/json_query_sort_mix.rs"

[[bin]]
name = "fts-query-mix"
path = "src/bin/fts_query_mix.rs"

[[bin]]
name = "bigram-encoding-compare"
path = "src/bin/bigram_encoding_compare.rs"

[[bin]]
name = "core-allocation"
path = "src/bin/core_allocation.rs"

[[bin]]
name = "index-build-profile"
path = "src/bin/index_build_profile.rs"
required-features = ["index-timings"]

[features]
index-timings = ["objekte-core/index-timings"]

[dependencies]
objekte-core = { path = "../core" }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tempfile = "3"
rayon = "1.11"

[target.'cfg(target_os = "linux")'.dependencies]
io-uring = "0.7.15"
libc = "0.2"
