[package]
name = "objekte-bench"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[features]
sqlite-bench = ["dep:rusqlite"]
engine-compare = ["dep:rusqlite", "dep:turso", "dep:surrealdb", "dep:tokio"]

[[bin]]
name = "sqlite-cache-bench"
path = "src/bin/sqlite_cache.rs"
required-features = ["sqlite-bench"]

[[bin]]
name = "engine-compare"
path = "src/bin/engine_compare.rs"
required-features = ["engine-compare"]

[[bin]]
name = "array-compare"
path = "src/bin/array_compare.rs"
required-features = ["sqlite-bench"]

[[bin]]
name = "shared-query-compare"
path = "src/bin/shared_query_compare.rs"
required-features = ["sqlite-bench"]

[dependencies]
objekte-core = { path = "../core" }
jaq-all = "0.3"
qj = "0.3"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tempfile = "3"
rusqlite = { version = "0.41", features = ["bundled"], optional = true }
turso = { version = "=0.8.3", default-features = false, optional = true }
surrealdb = { version = "=3.3.4", default-features = false, features = ["kv-surrealkv"], optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros"], optional = true }
