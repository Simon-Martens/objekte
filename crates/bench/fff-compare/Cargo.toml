[package]
name = "objekte-fff-compare"
version = "0.1.0"
edition = "2024"

[workspace]

[dependencies]
fff-search = { git = "https://github.com/dmtrKovalenko/fff.git", rev = "d1c7dd47130ca670ab71e7466a1a3b4a57d5348d" }
objekte-core = { path = "../../core" }
rayon = "1.11"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sonic-rs = { version = "0.5.10", features = ["arbitrary_precision"] }
