[package]
name = "objekte-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "objekte"
path = "src/main.rs"

[dependencies]
objekte-core = { path = "../core" }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
sha2 = "0.10"
rusqlite = { version = "0.41", features = ["bundled"] }
fs2 = "0.4"
