[package]
name = "objekte-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "obj"
path = "src/main.rs"

[features]
default = ["tui"]
tui = ["dep:ratatui", "dep:regex", "dep:unicode-width", "dep:unicode-casefold"]
detailed-profiling = ["objekte-search-core/detailed-profiling"]

[dependencies]
objekte-search-core = { path = "../core" }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
base64 = "0.22"
ctrlc = "3"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "layout-cache"], optional = true }
regex = { version = "1", optional = true }
unicode-width = { version = "0.2", optional = true }
unicode-casefold = { version = "0.2", optional = true }

[dev-dependencies]
tempfile = "3"
libc = "0.2"
