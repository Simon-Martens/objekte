[package]
name = "objekte-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[features]
index-timings = []

[dependencies]
ahash = "0.8"
bincode = "1.3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
sonic-rs = { version = "0.5.10", features = ["arbitrary_precision"] }
thiserror = "2"
jsonschema = { version = "0.59", default-features = false, features = ["arbitrary-precision"] }
sha2 = "0.10"
num-bigint = "0.4"
num-cmp = "0.1"
rayon = "1.11"
grep-regex = "0.1"
grep-searcher = "0.1"
regex = "1"
regex-syntax = "0.8"
smallvec = "1"
unicode-casefold = "0.2"
pulldown-cmark = { version = "0.13.5", default-features = false }
html5gum = "0.8.4"
quick-xml = "0.38.4"
tempfile = "3"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", features = ["fs"] }
libc = "0.2"

[dev-dependencies]
tempfile = "3"
