[package]
name = "objekte-search-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "objekte_search_core"
path = "src/lib.rs"

[features]
default = []
detailed-profiling = []
store-feasibility = []
store-posting-rows = []
store-reverse-lz4 = []

[dependencies]
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = { version = "1.0", features = ["arbitrary_precision"] }
memchr = "2.8.3"
time = { version = "0.3", features = ["serde", "parsing", "formatting"] }
unicode-casefold = "0.2"
roaring = { version = "0.11", features = ["serde"] }
rayon = "1.11"
smallvec = "1.15"
icu_collator = "=2.4.0"
icu_locale_core = "=2.4.0"
sha2 = "0.10"
bincode = "1.3"
globset = "0.4"
regex = "=1.13.1"
regex-syntax = "=0.8.11"
libc = "0.2"
redb = "=4.6.0"
lz4_flex = { version = "=0.14.0", default-features = false, features = ["std", "safe-encode", "safe-decode", "checked-decode"] }

[[example]]
name = "bench_index_store"
required-features = ["store-feasibility"]
