[package]
name = "objekte-desktop"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[example]]
name = "environment_validation"
path = "examples/environment_validation.rs"

[dependencies]
gpui-kit = "=0.9.0"
objekte-cli = { path = "../cli", default-features = false }
objekte-search-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
gpui-kit = { version = "=0.9.0", features = ["test-support"] }
tempfile = "3"
