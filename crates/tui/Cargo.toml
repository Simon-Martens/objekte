[package]
name = "objekte-tui"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "objekte"
path = "src/main.rs"

[dependencies]
objekte-search-core = { path = "../core" }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "layout-cache"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-width = "0.2"

[dev-dependencies]
tempfile = "3"
