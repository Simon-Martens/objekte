<main id="workspace" data-url="{{ view_url }}" data-record-url="{{ url }}" data-section="{{ back }}" tabindex="-1">
  <div class="page-heading record-heading"><div><a data-nav href="{{ back }}" class="breadcrumb"><i class="ri-arrow-left-line" aria-hidden="true"></i>{{ back_label }}</a><h1 data-tooltip="{{ title }}">{{ title }}</h1></div>
    <div class="actions"><details class="action-menu record-actions"><summary class="button"><i class="ri-more-2-line" aria-hidden="true"></i>{{ "Actions"|t }}<i class="ri-arrow-down-s-line" aria-hidden="true"></i></summary><div class="menu-panel"><p class="eyebrow">{{ "Record"|t }}</p><a class="menu-action" href="{{ url }}/export"><i class="ri-download-line" aria-hidden="true"></i>{{ "Download JSON"|t }}</a><button class="menu-action" type="button" data-copy="{{ url }}"><i class="ri-link" aria-hidden="true"></i>{{ "Copy record path"|t }}</button>{% if can_delete %}<a class="menu-action danger menu-divider" data-nav href="{{ delete }}"><i class="ri-delete-bin-line" aria-hidden="true"></i>Delete {{ record_kind }}…</a>{% endif %}</div></details>
    {% if can_update %}<a class="button primary" data-nav href="{{ edit_link }}"><i class="ri-edit-line" aria-hidden="true"></i>{{ "Edit"|t }}</a>{% endif %}</div>
  </div>
  {{ parents|safe }}
  <div class="record-preview">{{ content|safe }}</div>
  {{ children|safe }}
  {{ references|safe }}
</main>
